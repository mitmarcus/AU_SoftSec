x-health: &health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 2s
  retries: 15

services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_JWT_KEY: ${API_JWT_KEY:-dev-only-api-key-change-me-0123456789}
      RECORDS_JWT_KEY: ${RECORDS_JWT_KEY:-dev-only-records-key-change-me-012345}
    healthcheck: *health
    networks: [public, internal]

  records:
    build: ./records
    environment:
      RECORDS_JWT_KEY: ${RECORDS_JWT_KEY:-dev-only-records-key-change-me-012345}
    volumes:
      - records-data:/data
    healthcheck: *health
    networks: [internal]

  payroll:
    build:
      context: .
      dockerfile: payroll/Dockerfile
    healthcheck: *health
    networks: [internal]

  tests:
    build: ./tests
    profiles: [test]
    environment:
      API_JWT_KEY: ${API_JWT_KEY:-dev-only-api-key-change-me-0123456789}
      RECORDS_JWT_KEY: ${RECORDS_JWT_KEY:-dev-only-records-key-change-me-012345}
    networks: [internal]

networks:
  public:
  internal:
    internal: true # no route out of the docker network

volumes:
  records-data:
